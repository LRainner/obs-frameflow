name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Compute version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}

  publish:
    name: Publish draft release
    needs: [meta, build]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: frameflow-windows-x64
          path: package

      - name: Assemble release archive
        shell: pwsh
        run: |
          $version = "${{ needs.meta.outputs.version }}"
          $stage = "release/frameflow"
          New-Item -ItemType Directory -Force -Path "$stage/bin/64bit" | Out-Null

          Copy-Item "package/obs-plugins/64bit/frameflow.dll" "$stage/bin/64bit/"
          Copy-Item -Recurse "package/obs-plugins/frameflow/data" "$stage/"
          Copy-Item "LICENSE", "README.md" "$stage/"

          $archive = "frameflow-$version-win64.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -Force

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          "$hash  $archive" | Out-File -Encoding ascii SHA256SUMS.txt

          Get-ChildItem $archive, SHA256SUMS.txt | Select-Object Name, Length

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.meta.outputs.version }}"
          $tag = "${{ needs.meta.outputs.tag }}"
          $notes = "docs/releases/$version.md"

          $args = @($tag, "--draft", "--title", "FrameFlow $version")
          if (Test-Path $notes) {
            $args += @("--notes-file", $notes)
          } else {
            $args += "--generate-notes"
          }

          gh release create @args "frameflow-$version-win64.zip" "SHA256SUMS.txt"
